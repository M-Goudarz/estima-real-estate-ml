
[project]
name = "estima-real-estate-ml"
version = "0.1.0"
description = "An end-to-end machine learning project for Iranian real estate price prediction."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/estima"]

[tool.pytest.ini_options]
testpaths = ["tests"]
